<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Editar Tarefa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    select {
      padding: 8px;
      width: 300px;
    }

    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      text-decoration: none;
    }

    .btn-save {
      background-color: #28A745;
    }

    .btn-cancel {
      background-color: #6C757D;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <h1>Editar Tarefa #{{ tarefa['id'] }}</h1>

  <!-- Formulário de Edição (UPDATE) -->
  <form action="/editar/{{ tarefa['id'] }}" method="POST">
    <div class="form-group">
      <label for="titulo">Título da Tarefa:</label>
      <input type="text" id="titulo" name="titulo" value="{{ tarefa['titulo'] }}" required>
    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select id="status" name="status">
        <option value="Pendente" {{ 'selected' if tarefa['status']=='Pendente' else '' }}>Pendente</option>
        <option value="Em Andamento" {{ 'selected' if tarefa['status']=='Em Andamento' else '' }}>Em Andamento</option>
        <option value="Concluída" {{ 'selected' if tarefa['status']=='Concluída' else '' }}>Concluída</option>
      </select>
    </div>

    <button type="submit" class="btn btn-save">Salvar Alterações</button>
    <a href="/" class="btn btn-cancel">Cancelar</a>
  </form>

</body>

</html>
