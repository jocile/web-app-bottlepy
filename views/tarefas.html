<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>CRUD Bottle + SQLite</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
    }

    .btn {
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      color: white;
    }

    .btn-edit {
      background-color: #007BFF;
    }

    .btn-del {
      background-color: #DC3545;
    }

    .btn-add {
      background-color: #28A745;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Minha Lista de Tarefas</h1>

  <!-- Usuário logado saindo da aplicação -->
  <div style="float: right;">
    <a href="/logout" style="color: #DC3545; font-weight: bold; text-decoration: none;">Sair / Logout</a>
  </div>


  <!-- Formulário de Criação (CREATE) -->
  <form action="/nova" method="POST">
    <input type="text" name="titulo" placeholder="Nova tarefa..." required style="padding: 7px; width: 250px;">
    <button type="submit" class="btn btn-add">Adicionar</button>
  </form>

  <!-- Tabela de Leitura (READ) -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tarefa</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      % for tarefa in tarefas:
      <tr>
        <td>{{ tarefa['id'] }}</td>
        <td>{{ tarefa['titulo'] }}</td>
        <td>{{ tarefa['status'] }}</td>
        <td>
          <a href="/editar/{{ tarefa['id'] }}" class="btn btn-edit">Editar</a>
          <a href="/deletar/{{ tarefa['id'] }}" class="btn btn-del"
            onclick="return confirm('Deseja excluir?')">Deletar</a>
        </td>
      </tr>
      % end
    </tbody>
  </table>

</body>

</html>
